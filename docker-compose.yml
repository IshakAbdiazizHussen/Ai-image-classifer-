# Full stack: frontend, backend, db, redis. Bring it all up with:
#   docker compose up --build
#
# Configuration comes entirely from .env (git-ignored — see .env.example
# for every key any service reads; constraints.md rule 18). Note this
# file builds DATABASE_URL/REDIS_URL itself from POSTGRES_*/service
# hostnames rather than reading a literal DATABASE_URL/REDIS_URL out of
# .env — those two keys in .env are for running the backend as a local
# process against the Phase 3 dev containers, where the hostnames/ports
# are different (localhost:5433, not db:5432).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host — only reachable from other compose
    # services (do/don't: don't publish db/redis ports unless needed).

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host, same reasoning as db.

  # One-shot job: runs the Alembic migration against `db`, then exits.
  # `backend` waits on this completing successfully before it starts.
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /app/backend
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      MODEL_VERSION: ${MODEL_VERSION}
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      MODEL_VERSION: ${MODEL_VERSION}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-30}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5242880}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # Read-only: a newly promoted model version just needs the host
      # directory updated, not an image rebuild (architecture.md).
      - ./ml/artifacts:/app/ml/artifacts:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # /healthz returns 503 (not 200) when a dependency is down — this
      # explicitly checks the status code rather than relying on
      # urlopen()'s HTTPError-on-non-2xx behavior to accidentally exit
      # non-zero (Phase 6: verified this actually flips to "unhealthy"
      # when Redis/DB are stopped, not just when the process is down).
      test:
        - "CMD"
        - "python"
        - "-c"
        - |
          import urllib.request, urllib.error, sys
          try:
              resp = urllib.request.urlopen("http://localhost:8000/healthz", timeout=3)
              sys.exit(0 if resp.status == 200 else 1)
          except (urllib.error.HTTPError, OSError):
              sys.exit(1)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the client bundle at build time — this is the URL
        # the USER'S BROWSER calls, so it must be host-reachable
        # (localhost:8000), not the in-network service name "backend".
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://localhost:3000/upload').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  # Holds all prediction history. `docker compose down` alone leaves this
  # untouched — only `docker compose down -v` deletes it, PERMANENTLY and
  # with no way to recover it afterward. No automated backup exists (see
  # docs/architecture.md's "Backup and Data Durability" section).
  db_data:
