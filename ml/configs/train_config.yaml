# Single source of truth for dataset, split, and training settings.
# Per constraints.md rule 5, the class list here is the ONLY place classes
# are defined — export/evaluation/backend/frontend all read it from the
# split manifest or exported metadata, which are generated from this file.
#
# This default config points at a small sample dataset (a CIFAR-10 subset,
# see ml/data/prepare_sample_dataset.py) so the pipeline is runnable and
# testable end-to-end right now. Swap `dataset.raw_dir` and `dataset.classes`
# to point at a real dataset for an actual training run — no code changes
# required.

dataset:
  raw_dir: ml/data/raw          # ImageFolder layout: raw_dir/<class_name>/*.png|jpg
  splits_dir: ml/data/splits    # persisted train/val/test manifest lives here
  classes:                      # single source of truth for the label set
    - airplane
    - automobile
    - bird
    - cat
    - deer
    - dog
    - frog
    - horse
    - ship
    - truck
  split_ratios:                 # must sum to 1.0
    train: 0.6
    val: 0.2
    test: 0.2
  image_size: 224                # resize target (matches the pretrained backbone)

seed: 1337                       # fixed seed for split + shuffling + model init

model:
  backbone: mobilenet_v3_small   # torchvision transfer-learning backbone
  pretrained: true

training:
  batch_size: 32
  epochs: 5                      # tuned against the real 300-img/class dataset:
                                  # a first attempt at 10 epochs showed val_loss
                                  # bottoming out at epoch 5 (0.628, val_acc
                                  # 0.802 — both the best of all 10 epochs) and
                                  # never recovering to that level again (best
                                  # val_loss after epoch 5 was 0.881 at epoch 9,
                                  # still worse). train.py only saves the final
                                  # epoch's weights, so epochs is set to the
                                  # observed sweet spot to actually capture it.
  learning_rate: 0.001
  num_workers: 2
  device: auto                   # auto | cpu | mps | cuda

checkpoints_dir: ml/checkpoints

evaluation:
  # A model export is only promotable for serving if its held-out test
  # accuracy clears this. This default is sized for the small sample
  # dataset/short smoke-test run (10 classes, random baseline = 10%) — set
  # a threshold appropriate to your actual dataset/use case before a real
  # training run.
  min_test_accuracy: 0.55

artifacts_dir: ml/artifacts
